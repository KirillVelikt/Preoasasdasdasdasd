name: Wipe repo

on:
  workflow_dispatch:

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Очистка репозитория
        run: |
          git config user.name "wipe-bot"
          git config user.email "wipe-bot@users.noreply.github.com"
          git checkout --orphan clean
          git rm -rf .
          git commit --allow-empty -m "Пустой репозиторий"
          git branch -D main
          git branch -m main
          git push -f origin main

      - name: Самоудаление workflow
        run: |
          rm -rf .github
          git add -A
          git commit -m "Удалён workflow очистки" || true
          git push -f origin main
